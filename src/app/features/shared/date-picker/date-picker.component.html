<div class="date-field">
  <input #field type="date" [value]="value" [attr.aria-label]="label" (input)="dateInput.emit($event)" />
  <button #trigger type="button" class="calendar-trigger" [attr.aria-label]="'Abrir calendario de ' + label" aria-haspopup="dialog" [attr.aria-expanded]="opened()" (click)="toggle()">
    <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4M17 3v4M3 11h18"/><path d="M8 15h2M14 15h2"/></svg>
  </button>
</div>
<div #panel popover="auto" class="calendar" role="dialog" [attr.aria-label]="'Seleccionar ' + label" (toggle)="onToggle($event)" (keydown.escape)="$event.preventDefault(); $event.stopPropagation(); close()">
  <header><span>{{ label }}</span><button type="button" aria-label="Cerrar calendario" (click)="close()">×</button></header>
  <div class="navigation">
    <button type="button" aria-label="Mes anterior" (click)="moveMonth(-1)">‹</button>
    <select aria-label="Mes" [value]="shown().getMonth()" (change)="setMonth($event)">@for (month of months; track month; let i = $index) { <option [value]="i">{{ month }}</option> }</select>
    <input aria-label="Año" type="number" min="100" max="9999" [value]="shown().getFullYear()" (change)="setYear($event)" />
    <button type="button" aria-label="Mes siguiente" (click)="moveMonth(1)">›</button>
  </div>
  <span class="sr-only" aria-live="polite">{{ months[shown().getMonth()] }} {{ shown().getFullYear() }}</span>
  <div class="weekdays" aria-hidden="true">@for (day of weekdays; track day) { <span>{{ day }}</span> }</div>
  <div class="days" role="group" aria-label="Días del mes">
    @for (day of days(); track day.value) {
      <button type="button" [attr.data-date]="day.value" [class.outside]="day.outside" [class.selected]="day.value === value" [class.today]="day.value === today()" [attr.aria-label]="day.label" [attr.aria-pressed]="day.value === value" [attr.aria-current]="day.value === today() ? 'date' : null" [tabIndex]="day.value === focused() ? 0 : -1" (keydown)="keyDay($event, day.value)" (click)="choose(day.value)">{{ day.day }}</button>
    }
  </div>
  <footer><button type="button" (click)="choose('')">Sin fecha</button><button type="button" class="today-button" (click)="choose(today())">Hoy</button></footer>
</div>
